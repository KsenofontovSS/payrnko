image: node:20-alpine

stages:
  - lint
  - test
  - build
  - e2e

variables:
  npm_config_cache: '$CI_PROJECT_DIR/.npm'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm
    - frontend/node_modules/

before_script:
  - cd frontend
  - npm ci --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint
    - npx tsc --noEmit

test:unit:
  stage: test
  script:
    - npm run test -- --coverage --ci
  coverage: '/All files[^|]*\|[^|]*\s+([\d\.]+)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/cobertura-coverage.xml

build:frontend:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - frontend/.next/
    expire_in: 1 hour

e2e:
  stage: e2e
  image: mcr.microsoft.com/playwright:v1.43.0-jammy
  before_script:
    - cd frontend
    - npm ci --prefer-offline
  script:
    - npx playwright install --with-deps
    - npm run test:e2e
  artifacts:
    when: always
    paths:
      - frontend/playwright-report/
    expire_in: 7 days
  allow_failure: true
